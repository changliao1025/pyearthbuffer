{% set name = "pyearthbuffer" %}
{% set version = "0.1.0" %}
{% set git_rev = "main" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  git_rev: {{ git_rev }}
  git_url: https://github.com/changliao1025/pyearthbuffer

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >={{ python_min }}
    - pip
    - setuptools >=61.0
  run:
    - python >={{ python_min }}
    - numpy
    - gdal
    - matplotlib
    - cartopy
    - scipy
    - geographiclib
    - pyearth

test:
  imports:
    - pyearthbuffer
    - pyearthbuffer.vector
    - pyearthbuffer.raster
    - pyearthbuffer.utility
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/changliao1025/pyearthbuffer
  summary: Geographic Coordinate System Buffer Operations in Python.
  license: BSD-3-Clause
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - changliao1025
  feedstock-name: {{ name|lower }}
