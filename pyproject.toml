[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcsbuffer"
version = "0.1.0"
description = "Geographic Coordinate System Buffer Operations in Python"
readme = "README.md"
authors = [
    {name = "Chang Liao"}
]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "gdal",
    "matplotlib",
    "cartopy",
    "pyearth",
    "geographiclib",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/changliao/gcsbuffer"
Documentation = "https://gcsbuffer.readthedocs.io"
Repository = "https://github.com/changliao/gcsbuffer"
